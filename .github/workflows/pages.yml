name: Publish lessons (GitHub Pages)

on:
  push:
    branches: [main]
    paths: ['lessons/**', 'data/**', 'index.html', 'css/**', 'js/**', 'assets/**', 'scripts/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Validate and rebuild the manifest
        run: |
          python scripts/build_manifest.py
          python scripts/validate_content.py
      - name: Assemble site
        run: |
          python scripts/sync_assets.py --dest _site \
            --remote-base "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/" \
            --repo "${{ github.repository }}"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: deployment
        uses: actions/deploy-pages@v4
